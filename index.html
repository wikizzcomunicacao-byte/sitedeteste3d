<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D Interativo</title>
    
    <!-- Importa a biblioteca do Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Estilização do Visualizador 3D */
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #090d16;
            border-radius: 12px;
            outline: none;
        }

        /* Barra de Carregamento Personalizada */
        .progress-bar {
            display: block;
            width: 33%;
            height: 6px;
            max-height: 6px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar.hide {
            visibility: hidden;
            transition: visibility 0.3s;
        }

        .update-bar {
            background-color: var(--primary-color);
            width: 0%;
            height: 100%;
            transition: width 0.3s;
        }

        /* Painel de Controles / Botões Abaixo do Modelo */
        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button.btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.btn:hover {
            background-color: #1d4ed8;
        }

        button.btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Visualização em 3D</h1>
        <p class="subtitle">Gire, amplie e explore o modelo em detalhes ou use a Realidade Aumentada pelo celular.</p>

        <!-- Componente do modelo 3D -->
        <model-viewer 
            id="modelo3d"
            src="seu-arquivo.glb" 
            alt="Modelo 3D Interativo" 
            auto-rotate 
            camera-controls 
            ar
            shadow-intensity="1">
            
            <!-- Indicador de progresso de carregamento -->
            <div class="progress-bar" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
        </model-viewer>

        <!-- Botões de interação extra -->
        <div class="controls">
            <button class="btn" onclick="alternarRotacao()">Ligar/Desligar Rotação</button>
            <button class="btn" onclick="resetarCamera()">Centralizar Câmera</button>
        </div>
    </div>

    <script>
        const modelViewer = document.querySelector('#modelo3d');

        // Função para alternar o giro automático
        function alternarRotacao() {
            modelViewer.autoRotate = !modelViewer.autoRotate;
        }

        // Função para resetar a posição da câmera
        function resetarCamera() {
            modelViewer.cameraTarget = 'auto';
            modelViewer.jumpCameraToGoal();
        }
    </script>

</body>
</html>
