<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D</title>
    
    <!-- Importa a biblioteca do Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
            max-width: 680px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            color: #1e293b;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Estilização aprimorada do visualizador 3D */
        model-viewer {
            width: 100%;
            height: 480px;
            background-color: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            outline: none;
        }

        .hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #475569;
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Visualização do Modelo 3D</h1>
        <p class="subtitle">Gire com o mouse ou toque na tela para explorar os detalhes.</p>

        <!-- Componente do modelo 3D -->
        <!-- Lembre-se de alterar "seu-arquivo.glb" para o nome real do seu arquivo -->
        <model-viewer 
            src="seu-arquivo.glb" 
            alt="Modelo 3D" 
            auto-rotate 
            camera-controls 
            ar
            shadow-intensity="1">
        </model-viewer>

        <div class="hint">
            💡 Lembre-se de colocar o seu arquivo <code>.glb</code> na mesma pasta deste HTML e atualizar o nome em <code>src="..."</code>.
        </div>
    </div>

</body>
</html>
